# Test Map — biofool/LeakDetector

suites:
  - name: mvp-api
    path: legacy/tests/test_api.py
    runner: "python3 -m pytest legacy/tests/ -q"
    framework: pytest
    count: 7
    tests:
      - test_create_and_get_report          # POST /api/reports → GET round-trip
      - test_rejects_out_of_bounds          # lat/lon validation → 4xx
      - test_rejects_bad_category           # enum validation → 4xx
      - test_nearby_duplicate_detection     # /api/reports/nearby radius behaviour
      - test_confirm_report                 # POST /api/reports/{id}/confirm bumps count
      - test_status_lifecycle_requires_staff_token  # PATCH gated by X-Staff-Token
      - test_stats_shape                    # GET /api/stats response shape
    covers:
      - legacy/app/main.py (all 8 routes at least touched)
      - legacy/app/db.py (insert/nearby/confirm/stats paths)
    does_not_cover:
      - photo upload pipeline
      - notify.py SMTP/audit paths
      - zone_for_point edge cases
      - public serializer contact-stripping (assertion absent — spec M3 adds it)

  - name: backend-jest
    path: backend/
    runner: "cd backend && npm test"
    framework: jest (NODE_OPTIONS=--experimental-vm-modules, ESM)
    count: 0
    status: "config present, no test files yet — spec §6.6 defines required coverage per milestone"
