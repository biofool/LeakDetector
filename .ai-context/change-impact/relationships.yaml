# Change-impact relationships — biofool/LeakDetector

relationships:
  - change: "docs/spec.md"
    impacts:
      - "docs/decisions.md (MUST add D-xx row — repo protocol)"
      - "docs/spec-vs-mvp.md (re-check gap list)"
      - "backend/src/* (all services implement the spec)"
      - "backend/migrations/*.sql (schema contract)"
      - "CLAUDE.md project section (if the pivot notice changes)"
    rule: "spec is canonical; code follows spec, not the reverse"

  - change: "docs/decisions.md"
    impacts:
      - "docs/spec.md (tagged [D-xx] lines must match)"
      - ".ai-context/decisions/architecture-decisions.md (summary refresh)"
    rule: "append-only, never renumber, Superseded-by for reversals"

  - change: "backend/migrations/001_init.sql"
    impacts:
      - "backend/src/services/{zones,duplicates,sla,outbox}.ts"
      - "backend/src/routes/reports.ts"
      - "backend/src/util/serialize.ts"
      - "backend/scripts/seed.ts"
    rule: "schema is the DB contract; index/geom choices are spec §2"

  - change: "backend/src/util/serialize.ts"
    impacts:
      - "every public route response (privacy boundary — strips reporter_*)"
      - "frontend map/track rendering fields"
    rule: "D-12 — reporter contact must never reach public payloads"

  - change: "backend/src/worker.ts"
    impacts:
      - "notification_outbox drain behaviour (spec §1.4 step 5)"
      - "SLA sweep timing/dedupe (spec §3)"
      - "resolution cascade to duplicates (D-10)"

  - change: "legacy/**"
    impacts:
      - "legacy/tests/test_api.py"
      - "nothing else — frozen reference code, no downstream consumers"
    rule: "do not extend; spec-vs-mvp.md documents deliberate differences"

  - change: ".gitignore"
    impacts:
      - ".githooks/pre-commit assumptions (secret patterns stay ignored)"
      - "data/ runtime artifacts (sqlite/uploads/audit stay local)"

  - change: "AGENTS.md global block"
    impacts:
      - "CLAUDE.md global-conventions mirror (must be edited together)"
    rule: "global rules sync from biofool/starter — don't fork them here"
