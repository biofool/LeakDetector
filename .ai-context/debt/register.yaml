# Technical Debt Register
# Sorted by priority_score (impact × likelihood × reach, each 1-5)

items:
  - id: DEBT-001
    type: code_smell
    summary: "search/SKILL.md is a duplicate of bx/SKILL.md (same frontmatter name: bx)"
    priority_score: 9  # impact:2 × likelihood:5 × reach:1 (only affects skill listing)
    impact: 2
    likelihood: 5
    reach: 1
    evidence:
      - path: .devin/skills/search/SKILL.md
        observation: "frontmatter has name: bx — identical to .devin/skills/bx/SKILL.md"
        evidence_type: "observed"
      - path: .devin/skills/bx/SKILL.md
        observation: "same name, same description, same line count (226)"
        evidence_type: "observed"
    recommendation: "Remove .devin/skills/search/ directory or rename to a distinct skill"
    status: open

  - id: DEBT-002
    type: improvement_opportunity
    summary: "No automated AGENTS.md ↔ CLAUDE.md sync check"
    priority_score: 12  # impact:4 × likelihood:3 × reach:1
    impact: 4
    likelihood: 3
    reach: 1
    evidence:
      - path: AGENTS.md
        observation: "line 13 says CLAUDE.md mirrors, but no tooling verifies this"
        evidence_type: "observed"
      - path: CLAUDE.md
        observation: "Global conventions section is manually maintained mirror"
        evidence_type: "observed"
    recommendation: "Add a script that diffs the rules sections and fails if out of sync"
