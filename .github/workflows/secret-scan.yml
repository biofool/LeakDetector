# Secret scanning CI check — runs on every push and PR.
# Fails the build if live secret patterns are found in git-tracked files.
#
# Uses scripts/scan_secrets.py from the repo (or the starter template).
# Writes an audit JSON artifact for download on failure.
name: Secret Scan

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for complete scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run secret scanner
        id: scan
        run: |
          if [ -f scripts/scan_secrets.py ]; then
            python3 scripts/scan_secrets.py --audit-dir data/audit
          else
            echo "scripts/scan_secrets.py not found — skipping (no scanner in this repo)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          done

      - name: Upload audit report on failure
        if: failure() && steps.scan.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-audit
          path: data/audit/secret_scan_*.json
          retention-days: 30
          if-no-files-found: ignore
